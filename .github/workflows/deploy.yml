name: Test and deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  https:
    name: Enforce HTTPS
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for certificate and require HTTPS
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if gh api --method PUT "repos/${{ github.repository }}/pages" -F https_enforced=true; then
              echo "HTTPS is enforced."
              exit 0
            fi
            echo "Waiting for GitHub's TLS certificate (attempt $attempt/60)…"
            sleep 60
          done
          echo "::error::GitHub's TLS certificate is still unavailable. Check the Pages custom-domain settings."
          exit 1
