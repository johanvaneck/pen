<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="description" content="A little room for big ideas. An infinite, private canvas for your pencil, stylus, or mouse." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pen — room to think</title>
  </head>
  <body>
    <canvas id="canvas" aria-label="Infinite drawing canvas. Draw with a pencil or mouse. Pan with touch, the hand tool, or Space and drag." tabindex="0"></canvas>
    <header class="header">
      <a class="brand" href="/" aria-label="Pen home"><span class="brand-mark">p<span>·</span></span><span>pen<span class="brand-period">.</span></span></a>
      <span class="tagline">Room to think.</span>
      <div class="document-actions">
        <span id="save-status" role="status">Opening canvas…</span>
        <button id="open" class="quiet" title="Open a saved .pen.json drawing">Open</button>
        <button id="export" class="quiet" title="Download your editable drawing">Save file <span aria-hidden="true">↗</span></button>
        <button id="png" class="quiet" title="Export the current view as a PNG image">PNG</button>
      </div>
    </header>
    <main>
      <div id="welcome" class="welcome" aria-hidden="true"><span class="eyebrow">NO EDGES. NO RUSH.</span><h1>Make space<br />for an idea.</h1><p>Pick up your pencil. Follow your curiosity.</p><span class="welcome-arrow">↙</span></div>
      <div class="view-controls" aria-label="Canvas view">
        <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="reset-view" title="Reset view to origin at 100%" aria-label="Reset view"><span id="zoom-label">100%</span></button>
        <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Drawing tools">
        <div class="tool-group">
          <button id="pen" class="tool active" aria-label="Pen" aria-pressed="true" title="Pen (P)"></button>
          <button id="eraser" class="tool" aria-label="Eraser" aria-pressed="false" title="Erase whole strokes (E)"></button>
          <button id="hand" class="tool" aria-label="Hand" aria-pressed="false" title="Pan (H), or hold Space"></button>
        </div>
        <span class="divider"></span>
        <div id="colors" class="tool-group colors" aria-label="Ink colors"></div>
        <label class="custom-color" title="Choose a custom ink color"><span aria-hidden="true">+</span><input id="custom-color" type="color" value="#242a38" aria-label="Custom ink color" /></label>
        <span class="divider"></span>
        <label class="size-control" title="Stroke width"><span id="size-dot" aria-hidden="true"></span><input id="size" type="range" min="1" max="24" value="4" aria-label="Stroke width" /></label>
        <span class="divider history-divider"></span>
        <div class="tool-group history">
          <button id="undo" class="tool" aria-label="Undo" title="Undo (⌘/Ctrl Z)" disabled></button>
          <button id="redo" class="tool" aria-label="Redo" title="Redo (⌘/Ctrl Shift Z)" disabled></button>
        </div>
      </div>
      <footer><span class="instructions"><span class="desktop-hint">Space + drag to move · Scroll to zoom</span><span class="touch-hint">Pencil to draw · Fingers to move & pinch</span></span><button id="clear" class="clear" title="Clear the canvas (can be undone)">Clear canvas</button></footer>
      <div id="toast" role="status" class="toast" hidden></div>
      <input id="file" type="file" accept=".json,.pen.json,application/json" hidden />
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
